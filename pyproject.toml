[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-timeline-to-reitti"
dynamic = ["version"]
description = "Convert Arc Timeline 4 weekly exports into Reitti-compatible GeoJSON"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Steven" }]
keywords = ["arc-timeline", "reitti", "geojson", "location-history", "gps"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
arc-to-reitti = "arc_to_reitti.cli:main"

[tool.setuptools.dynamic]
version = { attr = "arc_to_reitti.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
